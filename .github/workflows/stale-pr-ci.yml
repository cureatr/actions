name: "Test StalePR"

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run tests
        run: |
          cd stale-pr
          npm test
